name: Release

on:
  push:
    tags:
      - 'pc-v*'
      - 'android-v*'

permissions:
  contents: write

jobs:
  pc:
    if: startsWith(github.ref_name, 'pc-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp pc/viewer.py usb-screen-viewer.py
      - uses: softprops/action-gh-release@v2
        with:
          files: usb-screen-viewer.py
          generate_release_notes: true

  android:
    if: startsWith(github.ref_name, 'android-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong' -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk usb-screen.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: usb-screen.apk
          generate_release_notes: true
